name: Update README Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'Namecards/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Namecards subfolders and replace Gallery Section in README.md
        run: |
          GITHUB_REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          
          GALLERY_FILE="gallery_snippet.tmp"
          echo "---" >> "$GALLERY_FILE"
          echo "" >> "$GALLERY_FILE"

          # Check if Namecards directory exists
          if [ ! -d "Namecards" ]; then
            echo "Directory 'Namecards' not found!"
            exit 1
          fi

          # Loop through subdirectories inside Namecards/
          for folder in Namecards/*/; do
            # Handle case where no subdirectories exist
            [ -d "$folder" ] || continue
            
            # Extract subfolder name (e.g., "Namecards/Anime/" -> "Anime")
            folder_name=$(basename "$folder")
            
            # Find matching images directly inside this subfolder
            mapfile -t folder_images < <(find "$folder" -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.gif" -o -iname "*.webp" -o -iname "*.svg" \) | sort)

            if [ ${#folder_images[@]} -gt 0 ]; then
              echo "## 📂 $folder_name" >> "$GALLERY_FILE"
              echo "" >> "$GALLERY_FILE"

              for img in "${folder_images[@]}"; do
                raw_url="${GITHUB_REPO_URL}/blob/${BRANCH}/${img}"
                echo "<a href=\"${raw_url}\" target=\"_blank\">" >> "$GALLERY_FILE"
                echo "  <img src=\"${img}\" width=\"220\" style=\"border-radius:10px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,0.2);\" />" >> "$GALLERY_FILE"
                echo "</a>" >> "$GALLERY_FILE"
              done

              echo "" >> "$GALLERY_FILE"
              echo "---" >> "$GALLERY_FILE"
              echo "" >> "$GALLERY_FILE"
            fi
          done

          # Target-replace ONLY the GALLERY section in README.md
          python3 -c "
          import re
          with open('README.md', 'r') as f:
              content = f.read()

          with open('gallery_snippet.tmp', 'r') as f:
              gallery_text = f.read()

          new_block = f'<!-- GALLERY-START -->\n{gallery_text}\n<!-- GALLERY-END -->'
          pattern = r'<!-- GALLERY-START -->.*?<!-- GALLERY-END -->'

          if re.search(pattern, content, flags=re.DOTALL):
              updated = re.sub(pattern, new_block, content, flags=re.DOTALL)
              with open('README.md', 'w') as f:
                  f.write(updated)
          else:
              print('Error: <!-- GALLERY-START --> markers missing in README.md!')
          "
          rm -f gallery_snippet.tmp

      - name: Commit and push gallery updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild README image gallery"
            git push
          else
            echo "No gallery changes detected."
          fi
